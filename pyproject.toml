[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semlock"
version = "0.1.0"
description = "Deterministic, local-first pre-merge semantic conflict detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Constitution §9: stdlib + tree-sitter (+ per-language grammars) only.
    # Grammar AST shapes pinned for INV-1 determinism; bumps re-run full suites.
    # tree-sitter core pinned to the 0.23.x series the grammar packages below
    # were built/tested against (tree-sitter-python declares core~=0.22,
    # tree-sitter-typescript declares core~=0.23); resolving core up to 0.26
    # crossed an ABI generation the 0.23.x grammar wheels don't match and
    # segfaulted intermittently on Linux (observed in CI, not reproducible on
    # Windows) — never loosen this range without re-running the full suite on
    # Linux, not just locally.
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.4"]

[project.scripts]
semlock = "semlock.cli.main:main"

[tool.setuptools.packages.find]
include = ["semlock*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
