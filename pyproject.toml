[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semlock"
version = "0.1.0"
description = "Deterministic, local-first pre-merge semantic conflict detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Constitution §9: stdlib + tree-sitter (+ per-language grammars) only.
    # Grammar AST shapes pinned for INV-1 determinism; bumps re-run full suites.
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
# S5 arbitration (#8): `semlock` console entry — fresh-clone install criterion.
semlock = "semlock.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["semlock*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
